name: Build Ultra Downloader APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP and Prepare Build
        run: |
          unzip -o UltraDownloader_Android_Project.zip -d extracted_project
          cp -r extracted_project/UltraDownloader/* .
          python3 -c '
          p = "app/build.gradle.kts"
          t = open(p).read().replace(r"\"\$backendBaseUrl\"", r"\"\\\"$backendBaseUrl\\\"\"").replace("\\\\\"$backendBaseUrl\\\\\"", "\\\"$backendBaseUrl\\\"")
          open(p, "w").write(t)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
