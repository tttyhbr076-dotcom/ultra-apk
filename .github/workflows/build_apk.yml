name: Build Ultra Downloader APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unpack Project Safely
        run: |
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file was not committed to the repository!"
            exit 1
          fi
          unzip -q -o "$ZIP_FILE" -d unpacked_dir
          cp -rf unpacked_dir/UltraDownloader/* . || cp -rf unpacked_dir/* .
          rm -rf unpacked_dir
          python3 -c '
          s = open("settings.gradle.kts").read().replace("\\\\\\\\", "\\\\")
          open("settings.gradle.kts", "w").write(s)
          b = open("app/build.gradle.kts").read().replace("\\\"$backendBaseUrl\\\"", "\"\\\"$backendBaseUrl\\\"\"").replace("\"\"\\\"", "\"\\\"")
          open("app/build.gradle.kts", "w").write(b)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
