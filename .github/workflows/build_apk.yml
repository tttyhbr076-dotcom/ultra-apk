name: Build Ultra Downloader APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP and Fix Gradle Escapes
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project
          if [ -d "extracted_project/UltraDownloader" ]; then
            cp -r extracted_project/UltraDownloader/* .
          else
            cp -r extracted_project/* .
          fi
          sed -i 's/\\\\/\\/g' settings.gradle.kts
          sed -i 's/\\"\\$backendBaseUrl\\"/\\"$backendBaseUrl\\"/g' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
